[versions]
mod-version = "1.1.2+26.2"

# Minecraft 26.x ships unobfuscated: no Yarn, no intermediary, Mojang names at compile time and at runtime.
minecraft = "26.2"
fabric-loader = "0.19.5"
fabric-api = "0.161.0+26.2"
# Loom 1.17 line (the one Fabric names for 26.2), "net.fabricmc.fabric-loom" = the no-remap plugin
loom = "1.17.21"
junit = "5.10.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
